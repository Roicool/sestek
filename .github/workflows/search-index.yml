name: Refresh site search index

# Crawls the published site from its sitemap and pushes the fresh index into
# the Webflow Cloud app's KV via POST /demos/api/search/index — no redeploy.
#
# Runs every night, on demand (workflow_dispatch), and when Webflow publishes
# if you point a site publish webhook at a `repository_dispatch` with
# event_type "site-published" (needs a GitHub token in the webhook URL — see
# webflow-cloud-app/README.md → "Site Search").
#
# Secrets:
#   SEARCH_INDEX_SECRET  — same value as the app's SEARCH_INDEX_SECRET env var
# Optional variables:
#   SEARCH_SITE          — site to crawl (default https://www.sestek.com)
#   SEARCH_INDEX_URL     — POST target (default https://www.sestek.com/demos/api/search/index)

on:
  schedule:
    - cron: "17 2 * * *"        # 02:17 UTC daily
  workflow_dispatch:
  repository_dispatch:
    types: [site-published]

concurrency:
  group: search-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webflow-cloud-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webflow-cloud-app/package-lock.json

      - run: npm ci

      - name: Crawl site → public/search-index.json
        env:
          SITE: ${{ vars.SEARCH_SITE || 'https://www.sestek.com' }}
        run: npx tsx scripts/build-search-index.ts --site "$SITE"

      - name: Push index to the app (KV)
        env:
          URL: ${{ vars.SEARCH_INDEX_URL || 'https://www.sestek.com/demos/api/search/index' }}
          SECRET: ${{ secrets.SEARCH_INDEX_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::SEARCH_INDEX_SECRET secret'ı tanımlı değil — KV'ye push atlandı (index yalnız commit'lendi)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" \
            --data-binary @public/search-index.json)
          cat /tmp/resp.json; echo
          [ "$code" = "200" ] || { echo "::error::POST $URL → $code"; exit 1; }

      - name: Commit refreshed fallback index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/search-index.json
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git commit -m "search: refresh index ($(date -u +%Y-%m-%d))"
          git push
