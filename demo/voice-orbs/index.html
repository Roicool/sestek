<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Orbs — Demo</title>
  <link rel="stylesheet" href="../../css/components/voice-orbs.css">
  <style>
    /* Demo iskeleti — Webflow'da kart görünümünü site verir */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fdfcfc;
      font-family: system-ui, sans-serif;
    }
    .demo-card {
      width: min(1040px, calc(100vw - 32px));
      height: 558px;
      border-radius: 24px;
      background: rgb(245, 243, 241);
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.075);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 0 32px;
      box-sizing: border-box;
    }
    .vo-nav { display: flex; gap: 12px; }
  </style>
</head>
<body>

  <div class="demo-card" data-voice-orbs>
    <div class="vo-viewport">
      <div class="vo-track">
        <!--
          PLACEHOLDER varlıklar (ElevenLabs CDN) — canlıda:
          img src  → Webflow asset,
          data-vo-src → Cloudflare R2 (CORS policy şart!)
        -->
        <button class="vo-orb" data-vo-item data-vo-name="Christopher"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/ny5ykdiwmb.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-9.e00adc24.png" alt="">
        </button>
        <button class="vo-orb" data-vo-item data-vo-name="Jessica"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/ovfai5i88jd.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-5.f21107e1.png" alt="">
        </button>
        <button class="vo-orb" data-vo-item data-vo-name="James"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/jicvfwkdre9.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-1.be8a6b68.png" alt="">
        </button>
        <button class="vo-orb" data-vo-item data-vo-name="Mark"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/nvbceiamt1.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-4.60676b95.png" alt="">
        </button>
        <button class="vo-orb" data-vo-item data-vo-name="Hope"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/ckn43hcxbxu.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-8.2ab723e3.png" alt="">
        </button>
        <button class="vo-orb" data-vo-item data-vo-name="Nassim"
                data-vo-src="https://eleven-public-cdn.elevenlabs.io/payloadcms/v9grnli26c.mp3">
          <img src="https://eleven-public-cdn.elevenlabs.io/marketing_website/_next/static/media/creative-3.04cea590.png" alt="">
        </button>
      </div>
    </div>
    <div class="vo-nav">
      <button data-vo-prev aria-label="Previous voice">‹</button>
      <button data-vo-next aria-label="Next voice">›</button>
    </div>
  </div>

  <script src="../../js/core/utils.js" defer></script>
  <script src="../../js/components/voice-orbs.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.Sestek && typeof Sestek.initVoiceOrbs === "function") {
        Sestek.initVoiceOrbs();
      }
    });
  </script>
</body>
</html>
